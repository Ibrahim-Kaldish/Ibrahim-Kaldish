<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" role="img" aria-label="Ibrahim Kaldish, QA Automation and Software Testing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#0e75b6;animation:in 1s ease-out both}
    .s{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#57606a;animation:in 1s .3s ease-out both}
    .l{stroke:#0e75b6;stroke-width:3;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:0;animation:draw 1.2s .6s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes draw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
    @media (prefers-color-scheme:dark){.t{fill:#58a6ff}.s{fill:#8b949e}.l{stroke:#58a6ff}}
    @media (prefers-reduced-motion:reduce){.t,.s,.l{animation:none}}
  </style>
  <text class="t" x="400" y="62" text-anchor="middle">Ibrahim Kaldish</text>
  <text class="s" x="400" y="98" text-anchor="middle">QA Automation · Software Testing · Competitive Programming</text>
  <line class="l" x1="320" y1="116" x2="480" y2="116"/>
</svg>
